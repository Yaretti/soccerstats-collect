name: Collect SoccerSTATS second-half stats

on:
workflow_dispatch:

permissions:
contents: read

jobs:
collect:
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Check out repository
    uses: actions/checkout@v4
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
  - name: Run parser
    run: |
      if [ -f "src/soccerstats_collect.py" ]; then
        python src/soccerstats_collect.py
      elif [ -f "soccerstats_collect.py" ]; then
        python soccerstats_collect.py
      else
        echo "ERROR: soccerstats_collect.py not found."
        echo "Repository files:"
        find . -maxdepth 3 -type f | sort
        exit 1
      fi
  - name: Upload CSV and diagnostics
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: soccerstats-results-${{ github.run_number }}
      path: |
        output/
        debug/
      if-no-files-found: warn
      retention-days: 14