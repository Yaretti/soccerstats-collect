
name: Collect SoccerSTATS second-half stats

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run parser
        run: python src/soccerstats_collect.py

      - name: Upload CSV and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccerstats-results-${{ github.run_number }}
          path: |
            output/
            debug/
          if-no-files-found: warn
          retention-days: 14
